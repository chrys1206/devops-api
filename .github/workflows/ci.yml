name: CI/CD DevOps

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Debug - show files
        run: ls -R

      - name: Go to docker folder
        run: cd 2-docker/Node-Express-REST-API-MySQL-JS-Example && ls

      - name: Build Docker image
        run: |
          cd 2-docker/Node-Express-REST-API-MySQL-JS-Example
          docker build -t devops-api .

      - name: Run container (test)
        run: docker run -d -p 3000:3000 devops-api || true

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f 3-kubernetes/manifests/namespace.yaml
          kubectl apply -f 3-kubernetes/manifests/mysql-deployment.yaml
          kubectl apply -f 3-kubernetes/manifests/mysql-service.yaml
          kubectl apply -f 3-kubernetes/manifests/api-deployment.yaml
          kubectl apply -f 3-kubernetes/manifests/api-service.yaml
