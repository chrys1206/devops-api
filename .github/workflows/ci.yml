name: CI/CD DevOps

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Debug - list files
        run: ls -R

      - name: Build Docker image
        run: docker build -t devops-api ./2-docker/Node-Express-REST-API-MySQL-JS-Example

      - name: Run Docker container (test)
        run: docker run -d -p 3000:3000 devops-api

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f 3-kubernetes/manifests/namespace.yaml
          kubectl apply -f 3-kubernetes/manifests/mysql-deployment.yaml
          kubectl apply -f 3-kubernetes/manifests/mysql-service.yaml
          kubectl apply -f 3-kubernetes/manifests/api-deployment.yaml
          kubectl apply -f 3-kubernetes/manifests/api-service.yaml
